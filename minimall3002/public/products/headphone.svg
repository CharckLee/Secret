  <ellipse cx="270" cy="230" rx="28" ry="35" fill="#764ba2" opacity="0.5"/>
  <!-- 耳罩海绵纹理 -->
  <circle cx="130" cy="215" r="3" fill="#ddd"/>
  <circle cx="120" cy="240" r="3" fill="#ddd"/>
  <circle cx="140" cy="245" r="3" fill="#ddd"/>
  <circle cx="270" cy="215" r="3" fill="#ddd"/>
  <circle cx="260" cy="240" r="3" fill="#ddd"/>
  <circle cx="280" cy="245" r="3" fill="#ddd"/>
