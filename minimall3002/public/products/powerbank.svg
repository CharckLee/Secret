<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3443"/>
      <stop offset="100%" stop-color="#34e89e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- 充电宝主体 -->
  <rect x="120" y="120" width="160" height="200" rx="16" fill="#fff" opacity="0.95"/>
  <!-- 屏幕 -->
  <rect x="155" y="145" width="90" height="40" rx="8" fill="#0f3443"/>
  <text x="200" y="172" text-anchor="middle" font-size="22" fill="#34e89e" font-family="monospace" font-weight="bold">87%</text>
  <!-- USB-A口 -->
  <rect x="145" y="240" width="30" height="14" rx="4" fill="#0f3443"/>
  <!-- USB-C口 -->
  <rect x="225" y="240" width="24" height="14" rx="4" fill="#34e89e"/>
  <!-- 电池图标 -->
  <rect x="170" y="280" width="60" height="22" rx="5" fill="#0f3443" opacity="0.15"/>
  <rect x="172" y="282" width="40" height="18" rx="3" fill="#34e89e"/>
  <rect x="230" y="285" width="6" height="12" rx="2" fill="#0f3443" opacity="0.15"/>
  <!-- ⚡ -->
  <text x="340" y="100" font-size="32">⚡</text>
</svg>