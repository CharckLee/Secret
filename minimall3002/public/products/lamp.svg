<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- 光晕 -->
  <circle cx="200" cy="170" r="80" fill="url(#glow)"/>
  <!-- 灯座 -->
  <rect x="165" y="290" width="70" height="40" rx="8" fill="#fff" opacity="0.9"/>
  <rect x="175" y="300" width="50" height="30" rx="6" fill="#bdc3c7"/>
  <!-- 灯臂 -->
  <path d="M180 290 L160 200 Q155 180 180 170 L200 140" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <!-- 灯罩 -->
  <path d="M140 160 L200 100 L260 160 Z" fill="#ffeaa7" opacity="0.9"/>
  <path d="M140 160 L200 130 L260 160 Z" fill="#fff" opacity="0.7"/>
  <!-- 灯泡 -->
  <circle cx="200" cy="140" r="15" fill="#fff" opacity="0.95"/>
  <!-- 光线 -->
  <g stroke="#ffeaa7" stroke-width="2" opacity="0.5">
    <line x1="200" y1="120" x2="200" y2="90"/>
    <line x1="220" y1="130" x2="240" y2="110"/>
    <line x1="180" y1="130" x2="160" y2="110"/>
    <line x1="230" y1="145" x2="260" y2="135"/>
    <line x1="170" y1="145" x2="140" y2="135"/>
  </g>
</svg>