<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#434343"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- 扩展坞主体 -->
  <rect x="80" y="150" width="240" height="110" rx="14" fill="#555"/>
  <rect x="80" y="150" width="240" height="110" rx="14" fill="#666" opacity="0.5"/>
  <!-- USB大端口 x3 -->
  <rect x="100" y="170" width="40" height="16" rx="3" fill="#888"/>
  <rect x="150" y="170" width="40" height="16" rx="3" fill="#888"/>
  <rect x="200" y="170" width="40" height="16" rx="3" fill="#888"/>
  <!-- HDMI口 -->
  <rect x="100" y="198" width="50" height="12" rx="3" fill="#4488cc"/>
  <!-- SD卡槽 -->
  <rect x="170" y="198" width="35" height="14" rx="2" fill="#aaa"/>
  <!-- TF卡槽 -->
  <rect x="215" y="198" width="25" height="10" rx="2" fill="#aaa"/>
  <!-- USB-C线 -->
  <path d="M200 260 L200 310" stroke="#888" stroke-width="8" stroke-linecap="round"/>
  <rect x="188" y="305" width="24" height="18" rx="4" fill="#ccc"/>
  <!-- MacBook示意 -->
  <rect x="260" y="80" width="60" height="45" rx="5" fill="#ccc"/>
  <text x="340" y="90" font-size="24">💻</text>
</svg>