<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- 表带(上) -->
  <rect x="170" y="40" width="60" height="110" rx="10" fill="#2d3436"/>
  <!-- 表带(下) -->
  <rect x="170" y="250" width="60" height="110" rx="10" fill="#2d3436"/>
  <!-- 表盘 -->
  <rect x="115" y="120" width="170" height="170" rx="34" fill="#fff" opacity="0.95"/>
  <rect x="125" y="130" width="150" height="150" rx="28" fill="#2d3436"/>
  <!-- 屏幕内容: 心率+时间 -->
  <text x="200" y="175" text-anchor="middle" font-size="36" fill="#ff6b6b" font-family="monospace" font-weight="bold">14:30</text>
  <!-- 心率线 -->
  <path d="M130 210 L155 205 L170 220 L185 200 L200 215 L215 205 L230 220 L245 200 L260 210 L270 215" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
  <!-- 步数 -->
  <text x="200" y="250" text-anchor="middle" font-size="18" fill="#34e89e" font-family="monospace">🏃 8432步</text>
  <!-- 旋钮 -->
  <circle cx="270" cy="200" r="10" fill="#ff6b6b"/>
</svg>