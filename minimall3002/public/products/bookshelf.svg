  <circle cx="280" cy="140" r="25" fill="#27ae60" opacity="0.6"/>
  <circle cx="290" cy="125" r="18" fill="#2ecc71" opacity="0.5"/>
  <circle cx="270" cy="130" r="15" fill="#27ae60" opacity="0.4"/>
  <rect x="278" y="160" width="6" height="20" rx="2" fill="#d4a373"/>
