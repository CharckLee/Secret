  <!-- 隔板 -->
  <rect x="80" y="160" width="240" height="8" fill="#6B3A2A"/>
  <rect x="80" y="240" width="240" height="8" fill="#6B3A2A"/>
  <rect x="80" y="320" width="240" height="8" fill="#6B3A2A"/>
  <!-- 上层书籍 -->
  <rect x="95" y="95" width="18" height="60" rx="2" fill="#e74c3c" transform="rotate(-5 104 125)"/>
  <rect x="118" y="100" width="16" height="55" rx="2" fill="#3498db" transform="rotate(3 126 127)"/>
  <rect x="140" y="92" width="20" height="63" rx="2" fill="#2ecc71"/>
  <rect x="165" y="98" width="15" height="57" rx="2" fill="#f39c12" transform="rotate(-2 172 126)"/>
  <rect x="185" y="95" width="22" height="60" rx="2" fill="#9b59b6"/>
